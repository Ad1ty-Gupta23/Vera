="470" y="550" width="300" height="90" rx="8" fill="#E2F5EF" stroke="#3B947D"/><text x="620" y="580" font-family="Arial, sans-serif" font-size="21" fill="#142A43" font-weight="700" text-anchor="middle">Chroma + embeddings</text><text x="620" y="607" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Business-filtered retrieval</text><text x="620" y="630" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Sentence Transformers</text><rect x="880" y="550" width="340" height="90" rx="8" fill="#F4F7FA" stroke="#8C9BAD"/><text x="1050" y="580" font-family="Arial, sans-serif" font-size="21" fill="#142A43" font-weight="700" text-anchor="middle">Business outcomes</text><text x="1050" y="607" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Confirmed requests + handoffs</text><text x="1050" y="630" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Optional Gmail API follow-up</text><text x="50" y="689" font-family="Arial, sans-serif" font-size="13" fill="#54687C" font-weight="400" text-anchor="start">The browser relays JSON-Schema tool requests to VERA and returns tool results to AssemblyAI. API keys remain on the backend.</text></svg>