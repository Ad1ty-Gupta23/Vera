<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="white"/><defs><marker id="end" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#63798F"/></marker></defs><text x="50" y="61" font-family="Arial, sans-serif" font-size="34" fill="#142A43" font-weight="700" text-anchor="start">System architecture and technology stack</text><text x="50" y="94" font-family="Arial, sans-serif" font-size="18" fill="#54687C" font-weight="400" text-anchor="start">Technology labels identify the role of each component in the business assistant</text><polyline points="340,167 820,167" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)" marker-start="url(#end)" /><text x="580" y="157" font-family="Arial, sans-serif" font-size="14" fill="#42566C" font-weight="400" text-anchor="middle">Direct audio WebSocket</text><polyline points="200,245 200,335" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)" marker-start="url(#end)" /><text x="210" y="280" font-family="Arial, sans-serif" font-size="14" fill="#42566C" font-weight="400" text-anchor="start">Token / tool relay</text><polyline points="340,385 470,385" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)"  /><text x="405" y="375" font-family="Arial, sans-serif" font-size="14" fill="#42566C" font-weight="400" text-anchor="middle">Request</text><polyline points="770,385 880,385" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)" marker-start="url(#end)" /><text x="825" y="375" font-family="Arial, sans-serif" font-size="14" fill="#42566C" font-weight="400" text-anchor="middle">Grounding</text><polyline points="200,435 200,550" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)" marker-start="url(#end)" /><text x="210" y="482.5" font-family="Arial, sans-serif" font-size="14" fill="#42566C" font-weight="400" text-anchor="start"