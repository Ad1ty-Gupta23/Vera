="middle">Resolution check</text><text x="1097.5" y="212" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Did this answer help?</text><text x="1097.5" y="235" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Record customer feedback</text><rect x="50" y="425" width="350" height="135" rx="8" fill="#F4F7FA" stroke="#8C9BAD"/><text x="225" y="455" font-family="Arial, sans-serif" font-size="21" fill="#142A43" font-weight="700" text-anchor="middle">Action requested</text><text x="225" y="482" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Collect relevant details</text><text x="225" y="505" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Customer reviews and confirms</text><text x="225" y="528" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Track in Action Center</text><rect x="460" y="425" width="350" height="135" rx="8" fill="#E2F5EF" stroke="#3B947D"/><text x="635" y="455" font-family="Arial, sans-serif" font-size="21" fill="#142A43" font-weight="700" text-anchor="middle">Knowledge missing</text><text x="635" y="482" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Log the unanswered question</text><text x="635" y="505" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Owner approves a verified answer</text><text x="635" y="528" font-family="Arial, sans-serif" font-size="17" fill="#42566C" font-weight="400" text-anchor="middle">Index for future retrieval</text><rect x="870" y="425" width="350" height="135" rx="8" fill="#F4F7FA" stroke="#8C9BAD"/><text x="1045" y="455" font-family="Arial, sans-serif" font-size="21" fill="#142A43" font-weight="700" text-anchor="middle">Human help needed</text><text x="1045" 