<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="white"/><defs><marker id="end" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#63798F"/></marker></defs><text x="50" y="61" font-family="Arial, sans-serif" font-size="34" fill="#142A43" font-weight="700" text-anchor="start">Customer workflow and owner-controlled knowledge</text><text x="50" y="94" font-family="Arial, sans-serif" font-size="18" fill="#54687C" font-weight="400" text-anchor="start">Customers guide the conversation. Owners approve the knowledge used in future answers.</text><polyline points="290,207 355,207" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)"  /><polyline points="600,207 665,207" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)"  /><polyline points="910,207 975,207" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)"  /><polyline points="415,260 415,340 225,340 225,425" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="6 5"/><text x="320" y="330" font-family="Arial, sans-serif" font-size="14" fill="#42566C" font-weight="400" text-anchor="middle">Action intent</text><polyline points="545,260 545,345 635,345 635,425" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="6 5"/><text x="590" y="335" font-family="Arial, sans-serif" font-size="14" fill="#42566C" font-weight="400" text-anchor="middle">Unknown fact</text><polyline points="1098,260 1098,425" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="6 5"/><text x="1088" y="332.5" font-family="Arial, sans-serif" font-size="14" fill="#42566C" font-weight="400" text-anchor="end">Unresolved / human request</text><polyline points="460,490 435,490 435,285 477,285 477,260" fill="none" stroke="#63798F" stroke-width="2" marker-end="url(#end)"  st