services:
  - type: web
    name: vera
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/data/vera.db
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma_data
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
